[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kenya-3d"
version = "0.1.0"
description = "Claude + Blender MCP — civic data 3D visualization for East Africa"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
keywords = ["blender", "mcp", "civic-tech", "kenya", "3d-visualization", "claude"]
dependencies = ["httpx>=0.27", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pre-commit>=3"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "blender_scripts",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
